<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>နံပါတ်ကူးယူမယ်</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #fff);
    font-family: system-ui, sans-serif;
  }
  #box { text-align: center; padding: 24px; }
  #icon { font-size: 56px; }
  #msg { margin: 12px 0; font-size: 18px; }
  #num {
    font-size: 28px; font-weight: bold; letter-spacing: 2px;
    background: rgba(255,255,255,.08); border-radius: 12px; padding: 12px 20px;
    user-select: all; -webkit-user-select: all;
  }
  #tap {
    margin-top: 16px; font-size: 18px; padding: 12px 28px; border: 0; border-radius: 12px;
    background: var(--tg-theme-button-color, #2aabee); color: var(--tg-theme-button-text-color, #fff);
  }
</style>
</head>
<body>
<div id="box">
  <div id="icon">📋</div>
  <div id="msg">ကူးယူနေသည်…</div>
  <div id="num"></div>
  <br>
  <button id="tap" hidden>👆 နှိပ်ပြီး ကူးယူမယ်</button>
</div>
<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.ready) tg.ready();
  var n = new URLSearchParams(location.search).get("n") || "";
  document.getElementById("num").textContent = n;

  function ok() {
    document.getElementById("icon").textContent = "✅";
    document.getElementById("msg").textContent = "ကူးယူပြီးသား! 🎉";
    setTimeout(function () { if (tg && tg.close) tg.close(); }, 900);
  }
  async function doCopy() {
    try {
      await navigator.clipboard.writeText(n);
      ok();
      return true;
    } catch (e) {
      return false;
    }
  }
  (async function () {
    if (await doCopy()) return;
    // Fallback: copy on tap (some browsers need a gesture).
    var b = document.getElementById("tap");
    b.hidden = false;
    document.getElementById("msg").textContent = "အောက်ကခလုတ်ကို တစ်ချက်နှိပ်ပါ";
    b.onclick = doCopy;
  })();
</script>
</body>
</html>
